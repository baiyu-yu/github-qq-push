<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>/* %%COMMON_CSS%% */</style>
  <style>
    /* Sharp & Minimalist Design System for Help Card */
    .card {
      border-radius: 0 !important;
      margin: 16px;
      padding: 28px 28px 20px 28px;
      max-width: 760px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
    }
    .event-badge, .badge-help {
      border-radius: 0 !important;
      background: rgba(56, 139, 253, 0.12);
      color: var(--link-color);
      border: 1px solid rgba(56, 139, 253, 0.3);
      font-size: 11px;
      letter-spacing: 0.5px;
      font-weight: 600;
      padding: 3px 8px;
    }
    .card-title {
      border-radius: 0 !important;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.2px;
      margin-bottom: 4px;
    }
    .help-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .prefix-tag {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      color: var(--link-color);
      padding: 1px 6px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 0 !important;
    }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-top: 18px;
      margin-bottom: 8px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .section-tag {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
      padding: 1px 6px;
      border: 1px solid var(--card-border);
      background: var(--code-bg);
      color: var(--text-muted);
      border-radius: 0 !important;
    }
    .section-tag.admin {
      color: #f85149;
      border-color: rgba(248, 81, 73, 0.3);
      background: rgba(248, 81, 73, 0.08);
    }
    .cmd-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1px;
      background: var(--card-border);
      border: 1px solid var(--card-border);
      margin-bottom: 8px;
    }
    .cmd-item {
      background: var(--card-bg);
      padding: 9px 12px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }
    .cmd-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .cmd-syntax {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12.5px;
      color: var(--link-color);
      font-weight: 600;
      white-space: nowrap;
    }
    .cmd-badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 0 !important;
      border: 1px solid var(--card-border);
      background: var(--code-bg);
      color: var(--text-muted);
      white-space: nowrap;
    }
    .cmd-badge.alias {
      color: #3fb950;
      border-color: rgba(63, 185, 80, 0.3);
      background: rgba(63, 185, 80, 0.08);
    }
    .cmd-desc {
      font-size: 12px;
      color: var(--text-main);
      text-align: right;
      line-height: 1.4;
    }
    .card-footer {
      border-radius: 0 !important;
      border-top: 1px solid var(--card-border);
      margin-top: 20px;
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <span class="event-badge badge-help">Help</span>
      <span class="repo-name">GitHub QQ Push</span>
    </div>

    <div class="card-title">可用指令手册</div>
    <div class="help-desc">
      <span>当前配置指令前缀：<span class="prefix-tag">{{prefix}}</span></span>
      <span>·</span>
      <span>支持群聊与私聊交互</span>
    </div>

    {{contentHtml}}

    <div class="card-footer">
      <span>发送指令或直接发送 GitHub 链接即可自动交互</span>
      <span class="watermark">GitHub QQ Push</span>
    </div>
  </div>
</body>
</html>
